<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - The Culinary Manuscript</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}"> <link rel="stylesheet" th:href="@{/css/mis-reservas.css}"> <link rel="stylesheet" th:href="@{/css/perfil.css}">
    <link rel="stylesheet" th:href="@{/css/navCliente.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body class="manuscript-theme mis-reservas-page"> <div class="dashboard-wrapper">
        
        <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>

        <div class="main-content">
            
            <header th:replace="~{fragmentos/navCliente :: navbarLogueado}"></header>

            <main class="mis-reservas-container">
                <header class="section-header-inline">
                    <div>
                        <span class="reserva-badge">Configuración de Cuenta</span>
                        <h1 class="serif-title" style="font-size: 3.2rem; color: #fff;">Mi Perfil</h1>
                    </div>
                </header>

                <div class="tabla-reservas-wrapper form-perfil-wrapper">
                    <form id="perfilForm" class="perfil-form">
                        
                        <div class="perfil-grid-inputs">
                            <div class="input-grupo-perfil">
                                <label for="perfilNombre">Nombre</label>
                                <input type="text" id="perfilNombre" required>
                            </div>
                            
                            <div class="input-grupo-perfil">
                                <label for="perfilApellido">Apellido</label>
                                <input type="text" id="perfilApellido" required>
                            </div>

                            <div class="input-grupo-perfil">
                                <label for="perfilCorreo">Correo Electrónico</label>
                                <input type="email" id="perfilCorreo" disabled style="opacity: 0.5; cursor: not-allowed;">
                                <small style="color: #555; font-size: 10px; margin-top: 5px; display: block;">El correo no puede modificarse por seguridad.</small>
                            </div>

                            <div class="input-grupo-perfil">
                                <label for="perfilTelefono">Teléfono</label>
                                <input type="text" id="perfilTelefono">
                            </div>

                            <div class="input-grupo-perfil full-width-input">
                                <label for="perfilDireccion">Dirección de Residencia</label>
                                <input type="text" id="perfilDireccion">
                            </div>
                        </div>

                        <div class="perfil-actions">
                            <button type="submit" class="btn-update-profile">
                                <span class="material-symbols-outlined icon-small">save</span>
                                Actualizar Datos
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/perfil.js}"></script>
</body>
</html>
