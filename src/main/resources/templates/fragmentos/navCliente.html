<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <header th:fragment="navbarLogueado" class="header efecto-blur">
        
        <div class="nav-left-group">
            <button id="mobileSidebarToggle" class="mobile-sidebar-toggle" aria-label="Abrir menú" title="Abrir Menú">
                <span class="material-symbols-outlined notranslate">menu</span>
            </button>
            <h2 style="cursor: pointer;" onclick="location.href='/cliente/dashboard'">GestRest</h2>
        </div>

        <div class="perfil-contenedor">
            <!-- BOTÓN CARRITO (CLIENTE) -->
            <button type="button" id="clienteNavBtnCarrito" class="nav-carrito-btn" onclick="abrirCarrito();" title="Mi Carrito de Reserva" aria-label="Carrito de Reserva">
                <span class="nav-carrito-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                </span>
                <span id="clienteNavCarritoBadge" class="nav-carrito-badge" style="display: none;">1</span>
            </button>

            <!-- SELECTOR DE IDIOMA (CLIENTE) -->
            <div class="lang-selector-dropdown" id="clienteLangSelector">
                <button type="button" class="lang-btn" id="clienteLangCurrentBtn" aria-expanded="false" title="Cambiar idioma / Change language">
                    <span class="material-symbols-outlined notranslate" style="font-size: 18px;">translate</span>
                    <span id="clienteLangCurrentLabel">ES</span>
                    <span class="material-symbols-outlined lang-arrow notranslate" style="font-size: 14px;">expand_more</span>
                </button>
                <div class="lang-menu" id="clienteLangMenu">
                    <button type="button" class="lang-option" data-lang="es">
                        <span class="lang-flag notranslate">🇪🇸</span>
                        <span>Español</span>
                        <span class="material-symbols-outlined lang-check notranslate" id="cliente-check-es">check</span>
                    </button>
                    <button type="button" class="lang-option" data-lang="en">
                        <span class="lang-flag notranslate">🇺🇸</span>
                        <span>English</span>
                        <span class="material-symbols-outlined lang-check notranslate" id="cliente-check-en" style="display:none;">check</span>
                    </button>
                </div>
            </div>

            <a th:href="@{/cliente/perfil}" class="perfil-link" title="Mi Perfil" aria-label="Mi Perfil">
                <span class="material-symbols-outlined notranslate">account_circle</span>
            </a>
        </div>

    </header>

    <!-- Drawer del Carrito disponible en vista cliente -->
    <div th:replace="~{fragmentos/carritoDrawer :: carritoDrawer}"></div>

    <script th:src="@{/js/sessionManager.js}"></script>
    <script th:src="@{/js/carritoReserva.js}"></script>
    <script th:src="@{/js/admin/translate.js}"></script>
</body>
</html>
