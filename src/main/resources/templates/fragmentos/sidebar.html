<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <aside th:fragment="sidebar" class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 class="gold-text" data-i18n="clientNav.brandTitle">Panel Cliente</h3>
                <button id="toggleSidebar" class="toggle-btn" title="Colapsar / Expandir menú">
                    <span class="material-symbols-outlined notranslate">menu_open</span>
                </button>
            </div>
            <p class="logo-subtitle" data-i18n="clientNav.brandSubtitle">GESTIÓN DE RESERVAS</p>
        </div>

        <nav class="sidebar-nav sidebar-menu" id="sidebarNav">
            <a th:href="@{/cliente/dashboard}" class="nav-item" data-page="dashboard">
                <span class="nav-icon">
                    <span class="material-symbols-outlined notranslate">dashboard</span>
                </span>
                <span class="menu-text" data-i18n="clientNav.panel">PANEL</span>
            </a>

            <a th:href="@{/cliente/mis-reservas}" class="nav-item" data-page="my-bookings">
                <span class="nav-icon">
                    <span class="material-symbols-outlined notranslate">calendar_today</span>
                </span>
                <span class="menu-text" data-i18n="clientNav.misReservas">MIS RESERVAS</span>
            </a>

            <a th:href="@{/cliente/calendario}" class="nav-item" data-page="calendar">
                <span class="nav-icon">
                    <span class="material-symbols-outlined notranslate">event</span>
                </span>
                <span class="menu-text" data-i18n="clientNav.calendario">CALENDARIO</span>
            </a>

            <a th:href="@{/cliente/reserva}" class="nav-item" data-page="reservations">
                <span class="nav-icon">
                    <span class="material-symbols-outlined notranslate">table_restaurant</span>
                </span>
                <span class="menu-text" data-i18n="clientNav.reservarMesa">RESERVAR MESA</span>
            </a>

            <a th:href="@{/cliente/perfil}" class="nav-item" data-page="profile">
                <span class="nav-icon">
                    <span class="material-symbols-outlined notranslate">account_circle</span>
                </span>
                <span class="menu-text" data-i18n="clientNav.miPerfil">MI PERFIL</span>
            </a>

            <a th:href="@{/menu/cliente/ver-menu}" class="nav-item" data-page="view-menu">
                <span class="nav-icon">
                    <span class="material-symbols-outlined notranslate">restaurant_menu</span>
                </span>
                <span class="menu-text" data-i18n="clientNav.verMenu">VER MENÚ</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button class="new-booking-btn" onclick="location.href='/cliente/reserva'">
                <span class="btn-text" data-i18n="clientNav.nuevaReserva">+ NUEVA RESERVA</span>
                <span class="btn-icon" style="display:none;">+</span>
            </button>
            <a href="/index" class="footer-link">
                <span class="material-symbols-outlined notranslate">storefront</span>
                <span class="menu-text" data-i18n="nav.verSitio">VER SITIO</span>
            </a>
            <a href="https://wa.me/573011733155" class="footer-link" target="_blank" rel="noopener">
                <span class="material-symbols-outlined notranslate">support_agent</span>
                <span class="menu-text" data-i18n="clientNav.soporte">SOPORTE</span>
            </a>
            <a href="javascript:void(0)" class="footer-link" id="logoutBtnSidebar">
                <span class="material-symbols-outlined notranslate">logout</span>
                <span class="menu-text" data-i18n="nav.cerrarSesion">CERRAR SESIÓN</span>
            </a>
        </div>
    </aside>
    <script th:src="@{/js/sessionManager.js}"></script>
</body>

</html>
