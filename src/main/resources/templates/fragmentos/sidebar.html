<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 class="gold-text">Maitre D' Panel</h3>
            <button id="toggleSidebar" style="background:none; border:none; color:#d4af37; cursor:pointer;">
                <span class="material-symbols-outlined">menu_open</span>
            </button>
        </div>
        <p>MANAGEMENT SUITE</p>
    </div>
    
    <nav class="sidebar-menu" id="sidebarNav">
        <a th:href="@{/dashboard}" data-page="dashboard">
            <span class="material-symbols-outlined">grid_view</span> 
            <span class="menu-text">Dashboard</span>
        </a>
        <a href="/mesas/gestion" data-page="tables">
            <span class="material-symbols-outlined">table_restaurant</span> 
            <span class="menu-text">Tables</span>
        </a>
        <a th:href="@{/reserva}" data-page="reservations">
            <span class="material-symbols-outlined">calendar_month</span> 
            <span class="menu-text">Reserva Ahora</span>
        </a>
        <a href="/analytics" data-page="analytics">
            <span class="material-symbols-outlined">analytics</span> 
            <span class="menu-text">Analytics</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <button class="new-booking-btn" onclick="location.href='/reserva'">
            <span class="btn-text">+ New Booking</span>
            <span class="btn-icon" style="display:none;">+</span>
        </button>
        <a href="/support">
            <span class="material-symbols-outlined">help</span> 
            <span class="menu-text">Support</span>
        </a>
        <a href="javascript:void(0)" id="logoutBtnSidebar">
            <span class="material-symbols-outlined">logout</span> 
            <span class="menu-text">Logout</span>
        </a>
    </div>
</aside>
</body>
</html>
