<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebarAdmin" class="sidebar" id="sidebarAdmin">
    <!-- Pre-evaluación inmediata para evitar parpadeos o saltos de layout en la carga -->
    <script>
        (function() {
            try {
                if (window.innerWidth > 992 && localStorage.getItem('adminSidebarClosed') === 'true') {
                    document.getElementById('sidebarAdmin')?.classList.add('closed');
                    document.documentElement.classList.add('sidebar-collapsed');
                }
            } catch(e) {}
        })();
    </script>

    <div class="sidebar-header">
        <div class="sidebar-header-top" style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
            <h3 class="gold-text" data-i18n="nav.brandTitle">Panel Administrador</h3>
            <button id="toggleAdminSidebar" class="toggle-btn" title="Colapsar / Expandir menú" aria-label="Colapsar / Expandir menú">
                <span class="material-symbols-outlined">menu_open</span>
            </button>
        </div>
        <p class="logo-subtitle" data-i18n="nav.brandSubtitle">CONSOLA DE ADMINISTRACIÓN</p>
    </div>
    
    <nav class="sidebar-nav sidebar-menu" id="sidebarAdminNav">
        <a th:href="@{/admin/dashboard}" class="nav-item" data-path="/admin/dashboard" title="Panel">
            <span class="nav-icon">
                <span class="material-symbols-outlined">dashboard</span>
            </span>
            <span class="menu-text" data-i18n="nav.panel">PANEL</span>
        </a>

        <a th:href="@{/admin/mesas}" class="nav-item" data-path="/admin/mesas" title="Gestionar Mesas">
            <span class="nav-icon">
                <span class="material-symbols-outlined">table_restaurant</span>
            </span>
            <span class="menu-text" data-i18n="nav.mesas">GESTIONAR MESAS</span>
        </a>

        <a th:href="@{/admin/reservas}" class="nav-item" data-path="/admin/reservas" title="Reservas">
            <span class="nav-icon">
                <span class="material-symbols-outlined">calendar_today</span>
            </span>
            <span class="menu-text" data-i18n="nav.reservas">RESERVAS</span>
        </a>

        <a th:href="@{/admin/usuarios}" class="nav-item" data-path="/admin/usuarios" title="Gestionar Usuarios">
            <span class="nav-icon">
                <span class="material-symbols-outlined">group</span>
            </span>
            <span class="menu-text" data-i18n="nav.usuarios">GESTIONAR USUARIOS</span>
        </a>

        <a th:href="@{/admin/perfil}" class="nav-item" data-path="/admin/perfil" title="Mi Perfil">
            <span class="nav-icon">
                <span class="material-symbols-outlined">account_circle</span>
            </span>
            <span class="menu-text" data-i18n="nav.perfil">MI PERFIL</span>
        </a>
        <a th:href="@{/admin/menu}" class="nav-item" data-path="/admin/menu" title="Gestionar Menú">
            <span class="nav-icon">
                <span class="material-symbols-outlined">restaurant_menu</span>
            </span>
            <span class="menu-text" data-i18n="nav.menu">GESTIONAR MENÚ</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <a href="/index" class="footer-link" title="Ver Sitio">
            <span class="material-symbols-outlined">storefront</span>
            <span class="menu-text" data-i18n="nav.verSitio">Ver Sitio</span>
        </a>
        <a href="#" class="footer-link" id="btnAdminLogout" onclick="cerrarSesionAdmin(event)" title="Cerrar Sesión">
            <span class="material-symbols-outlined">logout</span>
            <span class="menu-text" data-i18n="nav.cerrarSesion">Cerrar Sesión</span>
        </a>
    </div>
</aside>
<script th:src="@{/js/sessionManager.js}"></script>
</body>
</html>
