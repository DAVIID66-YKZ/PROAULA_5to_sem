<header th:fragment="navbar" class="header efecto-blur">
    <div class="nav-brand" onclick="location.href='/index'" style="cursor: pointer;">
        <h2>GestRest</h2>
    </div>

    <nav class="nav-contenedor">
        <ul class="nav-links">
            <li class="nav-item"><a th:href="@{/index}">Inicio</a></li>
            <li class="nav-item"><a th:href="@{/menu/listar}">Menú</a></li>
            <li class="nav-item"><a th:href="@{/index#contacto}">Contacto</a></li>
        </ul>
    </nav>

    <div class="nav-acciones" id="navAcciones">
        <a th:href="@{/menu/menu.pdf}" class="nav-pdf-btn" title="Descargar menú en PDF" aria-label="Descargar menú en PDF">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3v12"></path>
                <path d="m7 10 5 5 5-5"></path>
                <path d="M5 19h14"></path>
            </svg>
        </a>

        <button type="button" id="navBtnCarrito" class="nav-carrito-btn" onclick="abrirCarrito();" title="Mi Carrito de Reserva" aria-label="Carrito de Reserva">
            <span class="nav-carrito-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
            </span>
            <span id="navCarritoBadge" class="nav-carrito-badge" style="display: none;">1</span>
        </button>

        <a th:href="@{/login}" id="navBtnSesion" class="sesion-btn">Iniciar Sesión</a>

        <a href="#" id="navBtnPerfil" class="nav-perfil-btn" style="display: none;" title="Mi Panel" aria-label="Ir al Panel">
            <span class="nav-perfil-avatar">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </span>
        </a>
    </div>

    <!-- Drawer del Carrito disponible en todas las vistas -->
    <div th:replace="~{fragmentos/carritoDrawer :: carritoDrawer}"></div>

    <script th:src="@{/js/sessionManager.js}"></script>
    <script th:src="@{/js/carritoReserva.js}"></script>
    <script>
        (function () {
            function sincronizarBotonSesionNav() {
                const token = localStorage.getItem("token") || localStorage.getItem("jwtToken");
                const rol = (localStorage.getItem("rol") || "").trim().toUpperCase();
                const btnSesion = document.getElementById("navBtnSesion");
                const btnPerfil = document.getElementById("navBtnPerfil");
                const badge = document.getElementById("navCarritoBadge");

                if (badge) {
                    const tieneCarrito = localStorage.getItem("reservaCarrito");
                    badge.style.display = tieneCarrito ? "flex" : "none";
                }

                if (!btnSesion || !btnPerfil) return;

                if (token && (rol === "ADMIN" || rol === "ROLE_ADMIN")) {
                    btnSesion.style.display = "none";
                    btnPerfil.style.display = "inline-flex";
                    btnPerfil.href = "/admin/dashboard";
                    btnPerfil.title = "Panel de Administrador";
                    btnPerfil.setAttribute("aria-label", "Panel de Administrador");
                } else if (token && (rol === "CLIENTE" || rol === "ROLE_CLIENTE")) {
                    btnSesion.style.display = "none";
                    btnPerfil.style.display = "inline-flex";
                    btnPerfil.href = "/cliente/dashboard";
                    btnPerfil.title = "Panel de Cliente";
                    btnPerfil.setAttribute("aria-label", "Panel de Cliente");
                } else {
                    btnSesion.style.display = "inline-flex";
                    btnPerfil.style.display = "none";
                }
            }

            function inicializarScrollHeader() {
                const header = document.querySelector(".header");
                if (!header) return;
                function onScroll() {
                    const scrollY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
                    if (scrollY > 30) {
                        header.classList.add("header-scrolled");
                        header.classList.add("scrolled");
                    } else {
                        header.classList.remove("header-scrolled");
                        header.classList.remove("scrolled");
                    }
                }
                window.addEventListener("scroll", onScroll, { passive: true });
                onScroll();
            }

            window.sincronizarBotonSesionNav = sincronizarBotonSesionNav;

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", function () {
                    sincronizarBotonSesionNav();
                    inicializarScrollHeader();
                });
            } else {
                sincronizarBotonSesionNav();
                inicializarScrollHeader();
            }
        })();
    </script>
</header>
