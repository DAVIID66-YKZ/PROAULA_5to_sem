<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - GestRest</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/mis-reservas.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/perfil.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/navCliente.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/sidebar.css}">
</head>

<body class="manuscript-theme mis-reservas-page">
    <div class="dashboard-wrapper">

        <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>

        <div class="main-content">

            <header th:replace="~{fragmentos/navCliente :: navbarLogueado}"></header>

            <main class="mis-reservas-container">
                <header class="section-header-inline">
                    <div>
                        <span class="reserva-badge">Configuración de Cuenta</span>
                        <h1 class="serif-title" style="font-size: 3.2rem; color: #fff;">Mi Perfil</h1>
                    </div>
                </header>

                <div class="form-perfil-wrapper">
                    <div class="perfil-wrapper">
                        <!-- TARJETA 1: DATOS PERSONALES -->
                        <div class="perfil-card">
                            <div class="perfil-card-header">
                                <div class="perfil-card-icon">
                                    <span class="material-symbols-outlined">person</span>
                                </div>
                                <h2 class="perfil-card-title">Datos Personales</h2>
                            </div>

                            <form id="perfilForm" class="perfil-form">
                                <div class="perfil-form-row">
                                    <div class="perfil-form-group">
                                        <label for="perfilNombre" class="perfil-label">Nombre</label>
                                        <input type="text" id="perfilNombre" class="perfil-input" placeholder="Tu nombre" required>
                                    </div>

                                    <div class="perfil-form-group">
                                        <label for="perfilApellido" class="perfil-label">Apellido</label>
                                        <input type="text" id="perfilApellido" class="perfil-input" placeholder="Tu apellido" required>
                                    </div>
                                </div>

                                <div class="perfil-form-group">
                                    <label for="perfilCorreo" class="perfil-label">Correo Electrónico</label>
                                    <input type="email" id="perfilCorreo" class="perfil-input" disabled>
                                    <span class="perfil-hint">El correo no puede modificarse por seguridad.</span>
                                </div>

                                <div class="perfil-form-group">
                                    <label for="perfilTelefono" class="perfil-label">Teléfono</label>
                                    <input type="tel" id="perfilTelefono" class="perfil-input" placeholder="+57 300 1234567">
                                </div>

                                <div class="perfil-form-group">
                                    <label for="perfilDireccion" class="perfil-label">Dirección de Residencia</label>
                                    <input type="text" id="perfilDireccion" class="perfil-input" placeholder="Tu dirección completa">
                                </div>

                                <div class="perfil-actions">
                                    <button type="submit" id="btnActualizarDatos" class="btn-update-profile">
                                        <span class="material-symbols-outlined">save</span>
                                        Actualizar Datos
                                    </button>
                                </div>
                            </form>
                        </div>

                        <!-- TARJETA 2: CAMBIAR CONTRASEÑA -->
                        <div class="perfil-card">
                            <div class="perfil-card-header">
                                <div class="perfil-card-icon">
                                    <span class="material-symbols-outlined">lock</span>
                                </div>
                                <h2 class="perfil-card-title">Cambiar Contraseña</h2>
                            </div>

                            <form id="formPasswordCliente" class="perfil-form">
                                <div class="perfil-form-group">
                                    <label for="passwordActualCliente" class="perfil-label">Contraseña Actual</label>
                                    <div class="password-wrapper">
                                        <input type="password" id="passwordActualCliente" class="perfil-input" placeholder="••••••••" required>
                                        <button type="button" class="toggle-password-btn" onclick="togglePasswordCliente('passwordActualCliente', this)" title="Mostrar contraseña" aria-label="Mostrar contraseña">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                                <circle cx="12" cy="12" r="3"></circle>
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                <div class="perfil-form-group">
                                    <label for="passwordNuevaCliente" class="perfil-label">Nueva Contraseña (mínimo 8 caracteres)</label>
                                    <div class="password-wrapper">
                                        <input type="password" id="passwordNuevaCliente" class="perfil-input" minlength="8" placeholder="••••••••" required>
                                        <button type="button" class="toggle-password-btn" onclick="togglePasswordCliente('passwordNuevaCliente', this)" title="Mostrar contraseña" aria-label="Mostrar contraseña">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                                <circle cx="12" cy="12" r="3"></circle>
                                            </svg>
                                        </button>
                                    </div>
                                    <div class="perfil-strength-container">
                                        <div class="perfil-strength-bar-wrapper">
                                            <div id="barraFortalezaCliente" class="perfil-strength-bar"></div>
                                        </div>
                                        <p class="perfil-strength-text" id="textoFortalezaCliente">Muy débil</p>
                                    </div>
                                </div>

                                <div class="perfil-form-group">
                                    <label for="passwordConfirmarCliente" class="perfil-label">Confirmar Nueva Contraseña</label>
                                    <div class="password-wrapper">
                                        <input type="password" id="passwordConfirmarCliente" class="perfil-input" minlength="8" placeholder="••••••••" required>
                                        <button type="button" class="toggle-password-btn" onclick="togglePasswordCliente('passwordConfirmarCliente', this)" title="Mostrar contraseña" aria-label="Mostrar contraseña">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                                <circle cx="12" cy="12" r="3"></circle>
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                <div id="mensajeErrorCliente" class="perfil-error-container">
                                    <span class="material-symbols-outlined perfil-error-icon">error</span>
                                    <span class="perfil-error-text" id="textoErrorCliente"></span>
                                </div>

                                <div class="perfil-actions">
                                    <button type="submit" id="btnCambiarPassword" class="btn-update-profile">
                                        <span class="material-symbols-outlined">lock_reset</span>
                                        Cambiar Contraseña
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script th:src="@{/js/cliente/sidebar.js}"></script>
    <script th:src="@{/js/cliente/perfil.js}"></script>
</body>

</html>
