<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú del Manuscrito - GestRest</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/mis-reservas.css}">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/navCliente.css}">

    <style>
        /* Ajuste fino para acomodar las tarjetas del menú original al layout privado */
        .menu-page-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .menu-nav-inline {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            padding-bottom: 15px;
        }

        .menu-nav-inline a {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .menu-nav-inline a:hover {
            color: #d4af37;
        }
    </style>
</head>

<body class="manuscript-theme">

    <div class="dashboard-wrapper">

        <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>

        <div class="main-content">

            <header th:replace="~{fragmentos/navCliente :: navbarLogueado}"></header>

            <main class="dashboard-container">

                <div class="menu-page-container">

                    <header class="section-header-inline"
                        style="border-bottom: none; margin-bottom: 10px; padding-bottom: 0;">
                        <div>
                            <span class="reserva-badge">Gastronomía Premium</span>
                            <h1 class="serif-title" style="font-size: 3.2rem; color: #fff;">Menú del Manuscrito</h1>
                        </div>
                    </header>

                    <div class="menu-nav-inline">
                        <a href="#entradas">Entradas</a>
                        <a href="#platos-fuertes">Platos Fuertes</a>
                        <a href="#bebidas">Bebidas</a>
                        <a href="#postres">Postres</a>
                    </div>

                    <!-- ENTRADAS -->
                    <section class="menu-title" id="entradas">

                        <div class="menu-title-left">
                            <h2>Entradas</h2>
                        </div>

                    </section>

                    <section class="menu-grid" aria-label="Entradas">
                        <th:block th:each="plato : ${platos}">
                            <th:block th:if="${plato.categoria == 'ENTRADAS'}">
                                <div th:replace="~{componentes/menu-cards :: menu-cards(
                    ${plato.nombre},
                    ${plato.descripcion},
                    ${plato.precio},
                    ${plato.categoria},
                    ${plato.imgUrl},
                    ${plato.disponible}
                )}"></div>
                            </th:block>
                        </th:block>
                    </section>

                    <!-- Platos Fuertes -->
                    <section class="menu-title" id="platos-fuertes">

                        <div class="menu-title-left">
                            <h2>Platos Fuertes</h2>
                        </div>

                    </section>

                    <section class="menu-grid" aria-label="Platos Fuertes">
                        <th:block th:each="plato : ${platos}">
                            <th:block th:if="${plato.categoria == 'PLATOS_FUERTES'}">
                                <div th:replace="~{componentes/menu-cards :: menu-cards(
                    ${plato.nombre},
                    ${plato.descripcion},
                    ${plato.precio},
                    ${plato.categoria},
                    ${plato.imgUrl},
                    ${plato.disponible}
                )}"></div>
                            </th:block>
                        </th:block>
                    </section>

                    <!--Bebidas -->
                    <section class="menu-title" id="bebidas">

                        <div class="menu-title-left">
                            <h2>Bebidas</h2>
                        </div>

                    </section>

                    <section class="menu-grid" aria-label="Bebidas">
                        <th:block th:each="plato : ${platos}">
                            <th:block th:if="${plato.categoria == 'BEBIDAS'}">
                                <div th:replace="~{componentes/menu-cards :: menu-cards(
                    ${plato.nombre},
                    ${plato.descripcion},
                    ${plato.precio},
                    ${plato.categoria},
                    ${plato.imgUrl},
                    ${plato.disponible}
                )}"></div>
                            </th:block>
                        </th:block>
                    </section>

                    <!-- Postres -->
                    <section class="menu-title" id="postres">

                        <div class="menu-title-left">
                            <h2>Postres</h2>

                        </div>

                    </section>

                    <section class="menu-grid" aria-label="Postres">
                        <th:block th:each="plato : ${platos}">
                            <th:block th:if="${plato.categoria == 'POSTRES'}">
                                <div th:replace="~{componentes/menu-cards :: menu-cards(
                    ${plato.nombre},
                    ${plato.descripcion},
                    ${plato.precio},
                    ${plato.categoria},
                    ${plato.imgUrl},
                    ${plato.disponible}
                )}"></div>
                            </th:block>
                        </th:block>
                    </section>


                    <dialog class="menu-dialog" id="menuDialog" aria-labelledby="menuDialogTitle">
                        <div class="menu-dialog-content">
                            <button type="button" class="menu-dialog-close" id="menuDialogClose" aria-label="Cerrar">
                                &times;
                            </button>
                            <div class="menu-dialog-image-wrap">
                                <img class="menu-dialog-image" id="menuDialogImage" src="" alt="">
                            </div>
                            <div class="menu-dialog-info">
                                <span class="menu-dialog-category" id="menuDialogCategory"></span>
                                <h2 id="menuDialogTitle"></h2>
                                <p class="menu-dialog-description" id="menuDialogDescription"></p>
                                <div class="menu-dialog-footer">
                                    <span class="menu-dialog-price" id="menuDialogPrice"></span>
                                    <span class="menu-dialog-status" id="menuDialogStatus"></span>
                                </div>
                            </div>
                        </div>
                    </dialog>

                </div>
            </main>
        </div>
    </div>

    <script>
        (function () {
            const token = localStorage.getItem("token");
            const rol = localStorage.getItem("rol");
            const rolUpper = String(rol || "").trim().toUpperCase();
            if (!token || (rolUpper !== "CLIENTE" && rolUpper !== "ADMIN")) {
                window.location.href = "/login";
            }
        })();
    </script>
    <script th:src="@{/js/menu.js}"></script>
    <script th:src="@{/js/cliente/sidebar.js}"></script>
</body>

</html>
