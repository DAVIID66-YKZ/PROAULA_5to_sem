<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú del Manuscrito - GestRest</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/mis-reservas.css}">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/navCliente.css}">

    <style>
        /* Ajuste fino para acomodar las tarjetas del menú original al layout privado */
        .menu-page-container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 24px 60px;
        }

        .section-header-inline {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 15px;
        }

        /* Barra de Filtros Sticky (Idéntica en estilo al Landing Page) */
        .menu-filtro-sticky-wrapper {
            position: sticky;
            top: 75px;
            z-index: 100;
            background: rgba(18, 18, 18, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid rgba(212, 175, 55, 0.22);
            border-bottom: 1px solid rgba(212, 175, 55, 0.22);
            padding: 12px 18px;
            margin: 0 auto 35px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: top 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Cuando el navbar principal se oculta en el scroll, el sticky sube a la parte superior */
        body.header-is-hidden .menu-filtro-sticky-wrapper,
        body:has(.header.header-hidden-menu) .menu-filtro-sticky-wrapper {
            top: 15px;
        }

        .menu-nav-pills {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(212, 175, 55, 0.3) transparent;
            max-width: 100%;
            padding: 2px 4px;
            overscroll-behavior-x: contain;
            width: auto;
        }

        .menu-nav-pills::-webkit-scrollbar {
            height: 4px;
        }

        .menu-nav-pills::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 4px;
        }

        .menu-nav-pills .reserva-cat-pill {
            flex-shrink: 0 !important;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: #c5bba8;
            border-radius: 20px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.22s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 40px;
            box-sizing: border-box;
        }

        .menu-nav-pills .reserva-cat-pill span {
            pointer-events: none;
        }

        .menu-nav-pills .reserva-cat-pill:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.5);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .menu-nav-pills .reserva-cat-pill.active {
            background: var(--color-primary, #d4af37) !important;
            color: #0b0b0b !important;
            font-weight: 700 !important;
            border-color: var(--color-primary, #d4af37) !important;
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.4);
        }

        .menu-categoria-bloque {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        @media (max-width: 768px) {
            .menu-page-container {
                padding: 15px 12px 50px;
            }

            .section-header-inline .serif-title {
                font-size: 2.3rem !important;
            }

            .menu-filtro-sticky-wrapper {
                top: 65px;
                padding: 10px 10px;
                margin-bottom: 25px;
                border-radius: 10px;
                justify-content: flex-start;
            }

            body.header-is-hidden .menu-filtro-sticky-wrapper,
            body:has(.header.header-hidden-menu) .menu-filtro-sticky-wrapper {
                top: 8px;
            }

            .menu-nav-pills {
                justify-content: flex-start;
                width: 100%;
                gap: 8px;
            }

            .menu-nav-pills .reserva-cat-pill {
                padding: 7px 14px;
                font-size: 12px;
                min-height: 36px;
            }
        }
    </style>
</head>

<body class="manuscript-theme">

    <div class="dashboard-wrapper">

        <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>

        <div class="main-content">

            <header th:replace="~{fragmentos/navCliente :: navbarLogueado}"></header>

            <main class="dashboard-container">

                <div class="menu-page-container" th:with="
                    totalPlatos=${#lists.size(platos)},
                    entradas=${platos.?[categoria != null and (#strings.toUpperCase(categoria) == 'ENTRADAS' or #strings.toUpperCase(categoria) == 'ENTRADA')]},
                    fuertes=${platos.?[categoria != null and (#strings.toUpperCase(categoria) == 'PLATOS_FUERTES' or #strings.toUpperCase(categoria) == 'PLATO_FUERTE')]},
                    bebidas=${platos.?[categoria != null and (#strings.toUpperCase(categoria) == 'BEBIDAS' or #strings.toUpperCase(categoria) == 'BEBIDA')]},
                    postres=${platos.?[categoria != null and (#strings.toUpperCase(categoria) == 'POSTRES' or #strings.toUpperCase(categoria) == 'POSTRE')]},
                    otros=${platos.?[categoria == null or (#strings.toUpperCase(categoria) != 'ENTRADAS' and #strings.toUpperCase(categoria) != 'ENTRADA' and #strings.toUpperCase(categoria) != 'PLATOS_FUERTES' and #strings.toUpperCase(categoria) != 'PLATO_FUERTE' and #strings.toUpperCase(categoria) != 'BEBIDAS' and #strings.toUpperCase(categoria) != 'BEBIDA' and #strings.toUpperCase(categoria) != 'POSTRES' and #strings.toUpperCase(categoria) != 'POSTRE')]}
                ">

                    <header class="section-header-inline"
                        style="border-bottom: none; margin-bottom: 10px; padding-bottom: 0;">
                        <div>
                            <span class="reserva-badge" data-i18n="menu.gastronomiaPremium">Gastronomía Premium</span>
                            <h1 class="serif-title" style="font-size: 3.2rem; color: #fff;" data-i18n="menu.menuDelManuscrito">Menú del Manuscrito</h1>
                        </div>
                    </header>

                    <!-- NAVBAR DE FILTROS STICKY (IDÉNTICO AL LANDING PAGE) -->
                    <div class="menu-filtro-sticky-wrapper" id="menuFiltroStickyWrapper">
                        <nav class="menu-nav-pills" role="tablist" aria-label="Filtrar por categoría">
                            <button type="button" class="reserva-cat-pill active" data-cat-key="TODOS" onclick="filtrarMenuVer('TODOS', this)">
                                <span>Todos</span> <span th:text="${'(' + totalPlatos + ')'}"></span>
                            </button>
                            <button type="button" class="reserva-cat-pill" data-cat-key="ENTRADAS" onclick="filtrarMenuVer('ENTRADAS', this)" th:if="${not #lists.isEmpty(entradas)}">
                                <span>Entradas</span> <span th:text="${'(' + #lists.size(entradas) + ')'}"></span>
                            </button>
                            <button type="button" class="reserva-cat-pill" data-cat-key="PLATOS_FUERTES" onclick="filtrarMenuVer('PLATOS_FUERTES', this)" th:if="${not #lists.isEmpty(fuertes)}">
                                <span>Platos Fuertes</span> <span th:text="${'(' + #lists.size(fuertes) + ')'}"></span>
                            </button>
                            <button type="button" class="reserva-cat-pill" data-cat-key="BEBIDAS" onclick="filtrarMenuVer('BEBIDAS', this)" th:if="${not #lists.isEmpty(bebidas)}">
                                <span>Bebidas</span> <span th:text="${'(' + #lists.size(bebidas) + ')'}"></span>
                            </button>
                            <button type="button" class="reserva-cat-pill" data-cat-key="POSTRES" onclick="filtrarMenuVer('POSTRES', this)" th:if="${not #lists.isEmpty(postres)}">
                                <span>Postres</span> <span th:text="${'(' + #lists.size(postres) + ')'}"></span>
                            </button>
                            <button type="button" class="reserva-cat-pill" data-cat-key="OTROS" onclick="filtrarMenuVer('OTROS', this)" th:if="${not #lists.isEmpty(otros)}">
                                <span>Otras Opciones</span> <span th:text="${'(' + #lists.size(otros) + ')'}"></span>
                            </button>
                        </nav>
                    </div>

                    <!-- ENTRADAS -->
                    <div class="menu-categoria-bloque" data-categoria="ENTRADAS" th:if="${not #lists.isEmpty(entradas)}">
                        <section class="menu-title" id="entradas">
                            <div class="menu-title-left">
                                <h2>Entradas</h2>
                            </div>
                        </section>

                        <section class="menu-grid" aria-label="Entradas">
                            <th:block th:each="plato : ${entradas}">
                                <div th:replace="~{componentes/menu-cards :: menu-cards(
                                    ${plato.nombre},
                                    ${plato.descripcion},
                                    ${plato.precio},
                                    ${plato.categoria},
                                    ${plato.imgUrl},
                                    ${plato.disponible}
                                )}"></div>
                            </th:block>
                        </section>
                    </div>

                    <!-- Platos Fuertes -->
                    <div class="menu-categoria-bloque" data-categoria="PLATOS_FUERTES" th:if="${not #lists.isEmpty(fuertes)}">
                        <section class="menu-title" id="platos-fuertes">
                            <div class="menu-title-left">
                                <h2>Platos Fuertes</h2>
                            </div>
                        </section>

                        <section class="menu-grid" aria-label="Platos Fuertes">
                            <th:block th:each="plato : ${fuertes}">
                                <div th:replace="~{componentes/menu-cards :: menu-cards(
                                    ${plato.nombre},
                                    ${plato.descripcion},
                                    ${plato.precio},
                                    ${plato.categoria},
                                    ${plato.imgUrl},
                                    ${plato.disponible}
                                )}"></div>
                            </th:block>
                        </section>
                    </div>

                    <!-- Bebidas -->
                    <div class="menu-categoria-bloque" data-categoria="BEBIDAS" th:if="${not #lists.isEmpty(bebidas)}">
                        <section class="menu-title" id="bebidas">
                            <div class="menu-title-left">
                                <h2>Bebidas</h2>
                            </div>
                        </section>

                        <section class="menu-grid" aria-label="Bebidas">
                            <th:block th:each="plato : ${bebidas}">
                                <div th:replace="~{componentes/menu-cards :: menu-cards(
                                    ${plato.nombre},
                                    ${plato.descripcion},
                                    ${plato.precio},
                                    ${plato.categoria},
                                    ${plato.imgUrl},
                                    ${plato.disponible}
                                )}"></div>
                            </th:block>
                        </section>
                    </div>

                    <!-- Postres -->
                    <div class="menu-categoria-bloque" data-categoria="POSTRES" th:if="${not #lists.isEmpty(postres)}">
                        <section class="menu-title" id="postres">
                            <div class="menu-title-left">
                                <h2>Postres</h2>
                            </div>
                        </section>

                        <section class="menu-grid" aria-label="Postres">
                            <th:block th:each="plato : ${postres}">
                                <div th:replace="~{componentes/menu-cards :: menu-cards(
                                    ${plato.nombre},
                                    ${plato.descripcion},
                                    ${plato.precio},
                                    ${plato.categoria},
                                    ${plato.imgUrl},
                                    ${plato.disponible}
                                )}"></div>
                            </th:block>
                        </section>
                    </div>

                    <!-- Otras Opciones (Fallback dinámico) -->
                    <div class="menu-categoria-bloque" data-categoria="OTROS" th:if="${not #lists.isEmpty(otros)}">
                        <section class="menu-title" id="otros">
                            <div class="menu-title-left">
                                <h2>Otras Opciones</h2>
                            </div>
                        </section>

                        <section class="menu-grid" aria-label="Otras Opciones">
                            <th:block th:each="plato : ${otros}">
                                <div th:replace="~{componentes/menu-cards :: menu-cards(
                                    ${plato.nombre},
                                    ${plato.descripcion},
                                    ${plato.precio},
                                    ${plato.categoria},
                                    ${plato.imgUrl},
                                    ${plato.disponible}
                                )}"></div>
                            </th:block>
                        </section>
                    </div>


                    <dialog class="menu-dialog" id="menuDialog" aria-labelledby="menuDialogTitle">
                        <div class="menu-dialog-content">
                            <button type="button" class="menu-dialog-close" id="menuDialogClose" aria-label="Cerrar">
                                &times;
                            </button>
                            <div class="menu-dialog-image-wrap">
                                <img class="menu-dialog-image" id="menuDialogImage" src="" alt="">
                            </div>
                            <div class="menu-dialog-info">
                                <span class="menu-dialog-category" id="menuDialogCategory"></span>
                                <h2 id="menuDialogTitle"></h2>
                                <p class="menu-dialog-description" id="menuDialogDescription"></p>
                                <div class="menu-dialog-footer">
                                    <span class="menu-dialog-price" id="menuDialogPrice"></span>
                                    <span class="menu-dialog-status" id="menuDialogStatus"></span>
                                </div>
                            </div>
                        </div>
                    </dialog>

                </div>
            </main>
        </div>
    </div>

    <script>
        (function () {
            const token = localStorage.getItem("token");
            const rol = localStorage.getItem("rol");
            const rolUpper = String(rol || "").trim().toUpperCase();
            if (!token || (rolUpper !== "CLIENTE" && rolUpper !== "ADMIN")) {
                window.location.href = "/login";
            }
        })();

        function filtrarMenuVer(categoriaKey, botonClickeado) {
            const clave = String(categoriaKey || 'TODOS').trim().toUpperCase();

            // 1. Marcar píldora activa
            const nav = document.querySelector('#menuFiltroStickyWrapper .menu-nav-pills');
            if (nav) {
                nav.querySelectorAll('.reserva-cat-pill').forEach(btn => {
                    const esActivo = btn.getAttribute('data-cat-key') === clave;
                    btn.classList.toggle('active', esActivo);
                    btn.setAttribute('aria-selected', esActivo ? 'true' : 'false');
                    if (esActivo && botonClickeado) {
                        try {
                            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                        } catch (e) {
                            btn.scrollIntoView();
                        }
                    }
                });
            }

            // 2. Filtrar bloques de menú
            const bloques = document.querySelectorAll('.menu-categoria-bloque');
            bloques.forEach(bloque => {
                const cat = (bloque.getAttribute('data-categoria') || '').toUpperCase();
                if (clave === 'TODOS' || cat === clave) {
                    bloque.style.display = 'block';
                } else {
                    bloque.style.display = 'none';
                }
            });

            // 3. Scroll suave al inicio del catálogo si se clickeó un botón
            if (botonClickeado) {
                const wrapper = document.getElementById('menuFiltroStickyWrapper');
                if (wrapper) {
                    const headerOculto = document.body.classList.contains('header-is-hidden') || !!document.querySelector('.header.header-hidden-menu');
                    const yOffset = headerOculto ? -20 : -85;
                    const y = wrapper.getBoundingClientRect().top + window.pageYOffset + yOffset;
                    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
                }
            }
        }
    </script>
    <script th:src="@{/js/menu.js}"></script>
    <script th:src="@{/js/cliente/sidebar.js}"></script>
</body>

</html>
