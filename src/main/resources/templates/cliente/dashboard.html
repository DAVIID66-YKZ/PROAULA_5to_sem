<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - GestRest</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/navCliente.css}">
    <link rel="stylesheet" th:href="@{/css/cliente/sidebar.css}">
</head>

<body class="manuscript-theme">

    <div class="dashboard-wrapper">

        <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>

        <div class="main-content">

            <header th:replace="~{fragmentos/navCliente :: navbarLogueado}"></header>

            <main class="dashboard-container">

                <section class="welcome-block">
                    <div class="welcome-text">
                        <h1>Bienvenido de nuevo, <span id="userName" class="user-name serif-italic">Invitado</span></h1>
                        <p>Tu mesa te espera. Revisa tus próximas veladas o reserva un nuevo momento especial con nosotros.</p>
                    </div>
                    <button class="btn-new-reservation" onclick="location.href='/reserva'">
                        <span class="material-symbols-outlined icon-small">menu_book</span>
                        Nueva Reserva
                    </button>
                </section>

                <div class="booking-grid-functional">
                    <div id="featuredBookingContainer" class="w-100">
                        <div class="card-loading">Consultando reservas...</div>
                    </div>
                </div>

                <section class="future-bookings-section">
                    <div class="section-header">
                        <h3 class="section-title">PRÓXIMAS RESERVAS</h3>
                        <a href="/mis-reservas" class="link-view-history">VER LISTA COMPLETA</a>
                    </div>

                    <div id="futureBookingsContainer">
                    </div>
                </section>

            </main>
        </div>
    </div>

    <script th:src="@{/js/cliente/sidebar.js}"></script>
    <script th:src="@{/js/cliente/dashboard.js}"></script>
</body>

</html>
