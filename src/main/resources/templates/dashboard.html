<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - The Culinary Manuscript</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/navCliente.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body class="manuscript-theme">

    <div class="dashboard-wrapper">
        
        <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>

        <div class="main-content">
            
            <header th:replace="~{fragmentos/navCliente :: navbarLogueado}"></header>

            <main class="dashboard-container">
                
                <section class="welcome-block">
                    <div class="welcome-text">
                        <h1>Welcome back, <span id="userName" class="user-name serif-italic">Guest</span></h1>
                        <p>Your curated table awaits. Browse your upcoming evenings or manuscript a new chapter at our hearth.</p>
                    </div>
                    <button class="btn-new-reservation" onclick="location.href='/reserva'">
                        <span class="material-symbols-outlined icon-small">menu_book</span>
                        New Reservation
                    </button>
                </section>

                <div class="booking-grid-functional">
                    <div id="featuredBookingContainer" class="w-100">
                        <div class="card-loading">Consulting the manuscript archives...</div>
                    </div>
                </div>

                <section class="future-bookings-section">
                    <div class="section-header">
                        <h3 class="section-title">FUTURE BOOKINGS</h3>
                        <a href="/mis-reservas" class="link-view-history">VIEW FULL LIST</a>
                    </div>

                    <div id="futureBookingsContainer">
                        </div>
                </section>

            </main>
        </div>
    </div>

    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
