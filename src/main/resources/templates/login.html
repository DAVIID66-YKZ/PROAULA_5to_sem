<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ReservasApp</title>

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/nav.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script th:src="@{/js/login.js}" defer></script>

</head>

<body>
    <header th:replace="~{fragmentos/nav :: navbar}"></header>

    <div class="login-container">
        <form onsubmit="login(event)" class="login-form">

            <h1 class="login-title">Bienvenido</h1>
            <p class="login-subtitle">Introduce tus datos para continuar</p>

            <div class="input-group">
                <label for="correo" class="login-label">Correo Electrónico</label>
                <input type="email" id="correo" class="login-input" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="input-group">
                <label for="contrasena" class="login-label">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="contrasena" class="login-input" placeholder="Mínimo 8 caracteres" minlength="8" required>
                    <button type="button" class="toggle-password-btn" onclick="togglePassword('contrasena', this)" title="Mostrar contraseña" aria-label="Mostrar contraseña">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="btnLogin" class="login-button">
                <span class="btn-text">INGRESAR</span>
            </button>

            <p style="text-align: center; font-size: 0.9rem;">
                ¿No tienes cuenta?
                <a href="/register" class="login-links">Regístrate</a>
            </p>

        </form>
    </div>
    <footer th:replace="~{fragmentos/footer :: footer}"></footer>

</body>

</html>
