<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - El Manuscrito Culinario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: #1f1f1f;
            border: 1px solid #D4AF37;
            border-radius: 12px;
            padding: 50px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            color: #D4AF37;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #D4AF37;
            background: rgba(212, 175, 55, 0.05);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #D4AF37;
            color: #1a1a1a;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-login:hover {
            background: #e0bf47;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .credentials {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #D4AF37;
            border-radius: 6px;
            padding: 15px;
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }

        .credentials h4 {
            color: #D4AF37;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .credentials p {
            margin: 5px 0;
        }

        .error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #f44336;
            color: #f44336;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            color: #D4AF37;
            font-size: 14px;
        }

        .spinner {
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-top: 2px solid #D4AF37;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>El Manuscrito</h1>
            <p>Sistema de Reservas</p>
        </div>

        <div class="error" id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="admin@restaurante.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Tu contraseña"
                    required
                >
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                Autenticando...
            </div>

            <button type="submit" class="btn-login" id="submitBtn">
                ACCEDER
            </button>
        </form>

        <div class="credentials">
            <h4> Credenciales de Prueba:</h4>
            <p><strong>Email:</strong> admin@restaurante.com</p>
            <p><strong>Contraseña:</strong> 123456</p>
            <p style="margin-top: 10px; color: #666;">
                También puedes usar:<br>
                cliente@email.com<br>
                mesero@restaurante.com
            </p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loading = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Mostrar loading
            loading.style.display = 'block';
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;

            try {
                // Llamar a tu API de login
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        correo: email,
                        contrasena: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    // Guardar token en localStorage
                    localStorage.setItem('jwtToken', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));

                    // Redirigir al dashboard
                    window.location.href = '/dashboard';
                } else {
                    showError('Credenciales inválidas. Intenta de nuevo.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error de conexión. Intenta de nuevo.');
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }

        // Autocompletar con credenciales de admin (para pruebas)
        document.getElementById('email').value = 'admin@restaurante.com';
        document.getElementById('password').value = '123456';
    </script>
</body>
</html>
