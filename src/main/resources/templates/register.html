<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - ReservasApp</title>

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/nav.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script th:src="@{/js/register.js}" defer></script>
</head>

<body>
    <!-- NAV -->
    <header th:replace="~{fragmentos/nav :: navbar}"></header>

    <main class="register-page">
        <div class="register-container">
            <form onsubmit="register(event)" class="register-form">

                <h1 class="register-title">Crear Cuenta</h1>
                <p class="register-subtitle">Completa tus datos para registrarte</p>

                <!-- nombres y apellidos en grid -->
                <div class="register-grid">
                    <div class="input-group">
                        <label class="login-label">Nombre</label>
                        <input type="text" id="nombre" class="login-input" required>
                    </div>

                    <div class="input-group">
                        <label class="login-label">Apellido</label>
                        <input type="text" id="apellido" class="login-input" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="login-label">Correo Electrónico</label>
                    <input type="email" id="correo" class="login-input" required>
                </div>

                <div class="input-group">
                    <label class="login-label">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="contrasena" class="login-input" minlength="8" placeholder="••••••••" required>
                        <button type="button" class="toggle-password-btn" onclick="togglePassword('contrasena', this)" title="Mostrar contraseña" aria-label="Mostrar contraseña">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <small class="input-hint">Mínimo 8 caracteres</small>
                </div>

                <div class="input-group">
                    <label class="login-label">Dirección</label>
                    <input type="text" id="direccion" class="login-input" required>
                </div>

                <div class="input-group">
                    <label class="login-label">Teléfono</label>
                    <input type="tel" id="telefono" class="login-input" required>
                </div>

                <button type="submit" id="btnRegister" class="login-button">
                    <span class="btn-text">REGISTRARME</span>
                </button>

                <p class="register-login">
                    ¿Ya tienes cuenta?
                    <a th:href="@{/login}" class="login-links">Inicia sesión</a>
                </p>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer th:replace="~{fragmentos/footer :: footer}"></footer>
</body>
</html>
