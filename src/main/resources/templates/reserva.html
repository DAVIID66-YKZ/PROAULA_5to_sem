<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar - The Culinary Manuscript</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/reserva.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/nav.css}">
<body class="dashboard-layout">

    <div th:replace="~{fragmentos/sidebar :: sidebar}"></div>

    <div class="dashboard-main">
        
        <header th:replace="~{fragmentos/nav :: navbar}"></header>

        <main class="reserva-hero-container">
            <div class="reserva-card-full">
                
                <section class="reserva-visual">
                    <div class="reserva-visual-overlay">
                        <h2 class="serif-gold">Reserva tu mesa <br> en la historia</h2>
                        <p class="reserva-visual-texto">
                            Disfruta de una sinfonía de sabores creada por nuestros chefs expertos. 
                            Cada reserva es la promesa de una velada inolvidable.
                        </p>
                    </div>
                </section>

                <section class="reserva-form-section">
                    <div class="reserva-form-header">
                        <span class="reserva-badge">Solicitud de reserva</span>
                        <h1 class="reserva-titulo-form">Reservar</h1>
                    </div>

                    <form onsubmit="guardarReserva(event)" class="reserva-form-actual">
                        
                        <div class="reserva-grid-inputs">
                            <div class="input-grupo-reserva">
                                <label for="fecha">Fecha de llegada</label>
                                <input type="date" id="fecha" required>
                            </div>
                            <div class="input-grupo-reserva">
                                <label for="hora">Hora preferida</label>
                                <select id="hora">
                                    <option value="20:00" selected>08:00 PM</option>
                                    <option value="21:00">09:00 PM</option>
                                </select>
                            </div>
                            <div class="input-grupo-reserva">
                                <label for="personas">Invitados</label>
                                <input type="number" id="personas" min="1" max="12" value="2">
                            </div>
                        </div>

                        <div class="reserva-experiencia">
                            <label class="reserva-label-seccion">Select Your Experience</label>
                            <div class="reserva-experiencia-grid">
                                
                                <label class="exp-card">
                                    <input type="radio" name="experiencia" value="Mesa-Ventana" checked>
                                    <div class="exp-ui">
                                        <span class="material-symbols-outlined">window</span>
                                        <div class="exp-content">
                                            <span class="exp-nombre">Lado de la ventana</span>
                                            <span class="exp-detalle">City Views</span>
                                        </div>
                                    </div>
                                </label>

                                <label class="exp-card">
                                    <input type="radio" name="experiencia" value="Mesa-Alcoba">
                                    <div class="exp-ui">
                                        <span class="material-symbols-outlined">meeting_room</span>
                                        <div class="exp-content">
                                            <span class="exp-nombre">La alcoba</span>
                                            <span class="exp-detalle">Privado</span>
                                        </div>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="reserva-btn-confirmar">CONFIRM RESERVATION</button>
                        
                        <p class="reserva-nota">
                            Se recomienda vestimenta formal. Recibirá un correo electrónico de confirmación.
                        </p>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <script th:src="@{/js/reserva.js}"></script>
    <script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
