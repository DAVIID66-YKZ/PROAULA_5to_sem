    <div class="dashboard-container">
        <!-- ===== SIDEBAR ADMIN ===== -->
        <div th:replace="~{fragmentos/sidebarAdmin :: sidebarAdmin}"></div>

        <!-- ===== MOBILE BACKDROP ===== -->
        <div id="adminSidebarBackdrop" class="admin-sidebar-backdrop"></div>

                    </div>

                    <div class="reservas-filters">
                        <input type="text" id="buscarReserva" class="search-input" placeholder="Buscar por huésped, mesa o fecha...">
                        <select id="filtroEstado" class="filter-select">
                            <option value="">Todos los Estados</option>
                            <option value="CONFIRMADA">Confirmada</option>
                            <option value="PENDIENTE">Pendiente</option>
                            <option value="LLEGADA">Llegada</option>
                            <option value="COMPLETADA">Completada</option>
                            <option value="CANCELADA">Cancelada</option>

                    </div>

                                    <th>PERSONAS</th>
                                    <th>MESA</th>
                                    <th>ESTADO</th>
                                    <th>EXPERIENCIA</th>
                                    <th>ACCIONES</th>
                                </tr>
                            </thead>

                                <tr class="skeleton-table-row" aria-hidden="true">

                                        <div class="skeleton-flex-user">
                                            <span class="skeleton-bone circle" style="width: 32px; height: 32px;"></span>
                                            <div class="skeleton-user-lines">
                                                <span class="skeleton-bone" style="width: 130px;"></span>
                                                <span class="skeleton-bone" style="width: 90px; height: 10px;"></span>
                                            </div>
                                        </div>
                                    </td>

                                    <td class="skeleton-cell"><span class="skeleton-bone" style="width: 45%;"></span></td>
                                    <td class="skeleton-cell"><span class="skeleton-bone" style="width: 50%;"></span></td>

                                    <td class="skeleton-cell"><span class="skeleton-bone" style="width: 60%;"></span></td>

                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- PAGINACIÓN -->
                    <div class="pagination pagination-controls">
                        <button type="button" id="btnPagAnteriorTodas" class="btn-pagination" onclick="paginaAnteriorTodas()">Anterior</button>
                        <span class="page-info">
                            Mostrando <span id="paginaActualTodas">1</span> de <span id="totalPaginasTodas">1</span> páginas
                        </span>
                        <button type="button" id="btnPagSiguienteTodas" class="btn-pagination" onclick="paginaSiguienteTodas()">Siguiente</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Editar Estado de Reserva -->
    <div id="modalEditarReserva" class="modal-manuscript" style="display:none;">
        <div class="modal-content">
            <h2>Actualizar Estado</h2>
            <p>Modificar reserva de: <strong id="modalHuespedNombre" style="color:#fff;"></strong></p>
            <input type="hidden" id="modalReservaId">
            <div class="form-group" style="margin-top:15px;">
                <label style="color:#888; font-size:11px; font-weight:700; text-transform:uppercase;">NUEVO ESTADO</label>
                <select id="modalSelectEstado" class="filter-select" style="width:100%; margin-top:5px;">
                    <option value="CONFIRMADA">CONFIRMADA</option>
                    <option value="PENDIENTE">PENDIENTE</option>
                    <option value="LLEGADA">LLEGADA</option>
                    <option value="COMPLETADA">COMPLETADA</option>
                    <option value="CANCELADA">CANCELADA</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-modal-cancel" onclick="cerrarModalReserva()">Cancelar</button>
                <button type="button" class="btn-modal-save" onclick="guardarEdicionReserva()">Actualizar</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/admin/translate.js}"></script>
