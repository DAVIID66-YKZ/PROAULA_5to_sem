<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión del Menú - GestRest</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/dashboardAdmin.css}">
    <link rel="stylesheet" th:href="@{/css/reservaAdmin.css}">
</head>

<body>
    <div class="dashboard-container">
        <!-- ===== SIDEBAR ADMIN ===== -->
        <div th:replace="~{fragmentos/sidebarAdmin :: sidebarAdmin}"></div>

        <!-- ===== MOBILE BACKDROP ===== -->
        <div id="adminSidebarBackdrop" class="admin-sidebar-backdrop"></div>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main-content">
            <!-- ===== TOP NAVBAR (IDÉNTICO AL CLIENTE) ===== -->
            <header th:replace="~{fragmentos/navAdmin :: navbarAdmin}"></header>
            <section id="menu" class="content-section active">
                <header class="section-header">
                    <div>
                        <h1 data-i18n="menu.titulo">Gestión del Menú</h1>
                        <p data-i18n="menu.subtitulo">Administra los platos y bebidas de tu menú.</p>
                    </div>
                </header>
                <div class="mesas-container menu-container">
                    <div class="mesa-form-panel">
                        <h3 class="titulo-icono">
                            <span class="material-symbols-outlined">restaurant_menu</span>
                            <span data-i18n="menu.anadir">Añadir plato</span>
                        </h3>

                        <form id="formPlato" class="mesa-form">
                            <div class="form-group">
                                <label for="nombrePlato" data-i18n="menu.nombre">NOMBRE DEL PLATO</label>
                                <input type="text" id="nombrePlato" placeholder="Ej. Pasta artesanal" data-i18n-placeholder="menu.placeholderNombre" required>
                            </div>

                            <div class="form-group">
                                <label for="descripcionPlato" data-i18n="menu.descripcion">DESCRIPCIÓN</label>
                                <textarea id="descripcionPlato" class="menu-form-textarea"
                                    placeholder="Describe los ingredientes y preparación..." data-i18n-placeholder="menu.placeholderDescripcion" required></textarea>
                            </div>

                            <div class="form-group">
                                <label for="categoriaPlato" data-i18n="menu.categoria">CATEGORÍA</label>
                                <select id="categoriaPlato" class="filter-select" required>
                                    <option value="" disabled selected data-i18n="menu.seleccionarCategoria">Selecciona una categoría</option>
                                    <option value="ENTRADAS" data-i18n="menu.catEntradas">Entradas</option>
                                    <option value="PLATOS_FUERTES" data-i18n="menu.catPlatosFuertes">Platos Fuertes</option>
                                    <option value="BEBIDAS" data-i18n="menu.catBebidas">Bebidas</option>
                                    <option value="POSTRES" data-i18n="menu.catPostres">Postres</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="precioPlato" data-i18n="menu.precio">PRECIO (COP)</label>
                                <input type="number" id="precioPlato" placeholder="25000" min="10000" step="1000" required>
                            </div>

                            <div class="form-group">
                                <label for="imagenPlato" data-i18n="menu.seleccionaArchivo">Selecciona un archivo:</label>
                                <input type="file" id="imagenPlato" name="imagenPlato" accept="image/jpeg, image/png, image/webp">
                            </div>

                            <div class="form-group">
                                <label for="disponiblePlato" data-i18n="menu.disponible">DISPONIBLE</label>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="disponiblePlato" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>

                            <div class="form-group">
                                <label for="destacadoPlato" data-i18n="menu.destacado">DESTACAR EN INICIO ⭐</label>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="destacadoPlato">
                                    <span class="slider"></span>
                                </label>
                                <small style="color: #a8a8a8; font-size: 11px; margin-top: 5px; display: block;">
                                    Aparecerá en el mosaico de "Nuestros Platillos Destacados" de la pantalla principal.
                                </small>
                            </div>

                            <button type="submit" class="btn-save" data-i18n="menu.guardar">AÑADIR PLATO</button>
                            <button type="reset" class="btn-clear" data-i18n="menu.limpiar">LIMPIAR FORMULARIO</button>
                        </form>
                    </div>

                    <div class="mesas-registry">
                        <div class="registry-header">
                            <h3 data-i18n="menu.platos">Platos del menú</h3>
                            <div class="registry-stats">
                                <span class="badge active-badge"><span data-i18n="menu.disponiblesBadge">DISPONIBLES:</span> <span id="platosDisponibles">0</span></span>
                                <span class="badge total-badge"><span data-i18n="menu.totalBadge">TOTAL:</span> <span id="platosTotales">0</span></span>
                            </div>
                        </div>

                        <div class="menu-list-filters">
                            <input type="text" id="buscarPlato" class="search-input"
                                placeholder="Buscar por nombre, descripción o precio..." data-i18n-placeholder="menu.buscarPlaceholder">
                            <select id="filtroCategoria" class="filter-select" aria-label="Filtrar por categoría">
                                <option value="" data-i18n="menu.todasCategorias">Todas las categorías</option>
                                <option value="ENTRADAS" data-i18n="menu.catEntradas">Entradas</option>
                                <option value="PLATOS_FUERTES" data-i18n="menu.catPlatosFuertes">Platos Fuertes</option>
                                <option value="BEBIDAS" data-i18n="menu.catBebidas">Bebidas</option>
                                <option value="POSTRES" data-i18n="menu.catPostres">Postres</option>
                            </select>
                        </div>

                        <div class="platos-list" id="platosListContainer" aria-live="polite">
                            <p class="platos-list-message" data-i18n="menu.cargando">Cargando platos del menú...</p>
                        </div>

                        <div class="pagination pagination-controls">
                            <button type="button" class="btn-pagination" id="btnPagAnteriorPlatos"
                                onclick="paginaAnteriorPlatos()" data-i18n="common.anterior">Anterior</button>
                            <span class="page-info">
                                Mostrando <span id="paginaActualPlatos">1</span> de <span
                                    id="totalPaginasPlatos">1</span> páginas
                            </span>
                            <button type="button" class="btn-pagination" id="btnPagSiguientePlatos"
                                onclick="paginaSiguientePlatos()" data-i18n="common.siguiente">Siguiente</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

    </div>

    <script th:src="@{/js/admin/translate.js}"></script>
    <script th:src="@{/js/admin/adminNav.js}"></script>
    <script th:src="@{/js/admin/menu.js}"></script>
</body>

</html>
